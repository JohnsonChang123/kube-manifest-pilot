# Prerequisite: create Secret postgresql-credentials with key "password" in
# Namespace postgresql-demo before applying this manifest. The generated
# DEPLOY.md contains the matching command and safety notes.
apiVersion: v1
kind: Namespace
metadata:
  name: postgresql-demo
  labels:
    app.kubernetes.io/instance: postgresql-demo
    app.kubernetes.io/managed-by: kube-manifest-pilot
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-headless
  namespace: postgresql-demo
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: postgresql-demo
    app.kubernetes.io/managed-by: kube-manifest-pilot
    app.kubernetes.io/name: postgresql-headless
spec:
  selector:
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: postgresql-demo
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: postgresql
  clusterIP: None
  publishNotReadyAddresses: true
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: postgresql-demo
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: postgresql-demo
    app.kubernetes.io/managed-by: kube-manifest-pilot
    app.kubernetes.io/name: postgresql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: postgresql-demo
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: postgresql-demo
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: postgresql-demo
    app.kubernetes.io/managed-by: kube-manifest-pilot
    app.kubernetes.io/name: postgresql
spec:
  replicas: 1
  serviceName: postgresql-headless
  selector:
    matchLabels:
      app.kubernetes.io/component: database
      app.kubernetes.io/instance: postgresql-demo
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: postgresql-demo
        app.kubernetes.io/name: postgresql
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: password
            - name: POSTGRES_USER
              value: app
          readinessProbe:
            exec:
              command:
                - sh
                - "-c"
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 6
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - "-c"
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/component: database
          app.kubernetes.io/instance: postgresql-demo
          app.kubernetes.io/managed-by: kube-manifest-pilot
          app.kubernetes.io/name: postgresql
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
